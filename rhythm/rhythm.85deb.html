<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>拼豆成真 · 节奏练习</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#332c28}
    body{display:flex;justify-content:center}iframe{width:min(100%,430px);height:100%;border:0;background:#fff9ee}
  </style>
</head>
<body>
  <script>
    const query = new URLSearchParams(location.search);
    query.set('mode', 'rhythm');
    const target = 'game.html?' + query.toString();
    const mobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 1024);
    if (mobile) location.replace(target);
    else {
      const frame = document.createElement('iframe');
      frame.title = '拼豆成真节奏练习'; frame.allow = 'autoplay'; frame.src = target;
      document.body.append(frame);
    }
  </script>
</body>
</html>
